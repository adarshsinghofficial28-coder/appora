<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appora — Search Results</title>
  <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.0.2/dist/phosphor.js" defer></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-background">
    <div class="preloader" id="preloader" role="status" aria-label="Loading Appora">
    <div class="preloader-inner">
      <div class="preloader-ring" aria-hidden="true"></div>
      <span class="preloader-logo" aria-hidden="true"></span>
      <span class="preloader-brand">Appora</span>
      <span class="preloader-hint">Loading&hellip;</span>
    </div>
  </div>
  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <a href="/home" class="logo">
          <span class="logo-mark" role="img" aria-label="Appora logo"></span>
          <span class="font-extrabold text-xl text-foreground">Appora</span>
        </a>
        <nav class="main-nav">
          <a href="/home" class="text-sm font-medium text-muted-foreground hover:text-primary transition">Discover</a>
          <a href="/directory" class="text-sm font-medium text-muted-foreground hover:text-primary transition">Categories</a>
          <a href="/directory?tag=free" class="text-sm font-medium text-muted-foreground hover:text-primary transition">Free Apps</a>
          <a href="/directory?tag=open-source" class="text-sm font-medium text-muted-foreground hover:text-primary transition">Open Source</a>
        </nav>
        <div class="header-actions">
          <button class="btn-ghost text-sm">Sign In</button>
          <button class="btn-primary text-sm">Get Started</button>
          <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
            <phosphor-icon name="list" size="24"></phosphor-icon>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="search-bar" style="max-width: none;">
          <phosphor-icon name="magnifying-glass" size="18" class="search-icon"></phosphor-icon>
          <input type="search" placeholder="Search apps..." id="searchInput" aria-label="Search apps" autocomplete="off" />
        </div>
        <div style="margin-top: 1rem; color: var(--color-muted-foreground); font-size: 0.875rem;">
          <span id="resultsCount">6 results</span> for "productivity"
        </div>

        <h2 class="section-title" style="margin-top: 2rem;">Results</h2>
        <div class="apps-grid" id="searchGrid">
          <!-- populated by JS -->
        </div>

        <div class="pagination" style="margin-top: 2rem;">
          <button class="active">1</button>
          <button>2</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-card">
    <div class="container" style="padding: 3rem 0;">
      <div class="text-sm text-muted-foreground" style="padding-top: 1.5rem; border-top: 1px solid var(--color-border); text-align: center;">
        &copy; 2024 Appora. All rights reserved.
      </div>
    </div>
  </footer>

  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <script>
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    if (mobileMenuBtn && mobileMenu) mobileMenuBtn.addEventListener('click', () => mobileMenu.classList.add('open'));

    const apps = [
      { name: 'Linear', desc: 'Track and ship work across the software development life cycle.', tag: 'paid', platforms: ['web'], category: 'Productivity' },
      { name: 'Notion', desc: 'One workspace for writing, planning, and organizing.', tag: 'free', platforms: ['web', 'mac', 'win', 'linux'], category: 'Productivity' },
      { name: 'Trello', desc: 'Visual board-based project management tool.', tag: 'free', platforms: ['web', 'mac', 'win', 'linux'], category: 'Productivity' },
      { name: 'ClickUp', desc: 'All-in-one productivity platform.', tag: 'free', platforms: ['web', 'mac', 'win', 'linux'], category: 'Productivity' },
      { name: 'Asana', desc: 'Work management platform for teams.', tag: 'paid', platforms: ['web', 'mac', 'win', 'ios', 'android'], category: 'Productivity' },
      { name: 'Monday.com', desc: 'Work operating system for teams.', tag: 'paid', platforms: ['web', 'mac', 'win'], category: 'Productivity' },
    ];

    const iconColors = ['bg-indigo', 'bg-emerald', 'bg-amber', 'bg-rose', 'bg-blue', 'bg-purple', 'bg-teal', 'bg-orange'];
    function getIcon(name) {
      let h = 0;
      for (let i = 0; i < name.length; i++) {
        h = ((h << 5) - h) + name.charCodeAt(i);
        h |= 0;
      }
      return iconColors[Math.abs(h) % iconColors.length];
    }
    function platformIcons(platforms) {
      const map = { web: 'web', mac: 'apple', win: 'windows', linux: 'terminal', ios: 'iphone', android: 'android' };
      return platforms.map(p => `<phosphor-icon name="${map[p]}" size="14" style="color: var(--color-muted-foreground);"></phosphor-icon>`).join('');
    }
    function card(app) {
      const tagName = { free: 'Free', paid: 'Paid', 'open-source': 'Open Source' }[app.tag] || 'Free';
      const tagClass = app.tag === 'free' ? 'free' : app.tag === 'paid' ? 'paid' : 'open-source';
      return `
        <div class="app-card">
          <div class="app-card-header">
            <div class="app-icon ${getIcon(app.name)}">${app.name.charAt(0)}</div>
            <div style="flex: 1;">
              <h3 class="font-semibold">${app.name}</h3>
              <p class="text-muted-foreground">${app.desc}</p>
              <div class="app-card-footer" style="border-top:none; padding-top:0;">
                <div class="app-card-meta">
                  <span class="price-badge ${tagClass}">${tagName}</span>
                  <div class="platform-pill">${platformIcons(app.platforms)}</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }
    const grid = document.getElementById('searchGrid');
    if (grid) grid.innerHTML = apps.map(card).join('');

        // Preloader — hide fast, never block content
    var preloader = document.getElementById('preloader');
    function hidePreloader() {
      if (preloader) preloader.classList.add('hidden');
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { setTimeout(hidePreloader, 50); });
    } else {
      setTimeout(hidePreloader, 50);
    }
    setTimeout(hidePreloader, 800);
    window.addEventListener('beforeunload', function () {
      if (preloader) preloader.classList.remove('hidden');
    });
  </script>
  <script src="security.js"></script>
</body>
</html>
